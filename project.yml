name: Nocturn
options:
  bundleIdPrefix: com.brianmurphy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.10"
targets:
  Nocturn:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Nocturn
        excludes: ["Resources/icon.svg"]
    info:
      path: Nocturn/Info.plist
      properties:
        CFBundleDisplayName: Nocturn
        NSLocalNetworkUsageDescription: >-
          Nocturn connects to your Hermes agent dashboard on your local
          network to display its status.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brianmurphy.nocturn
      DEVELOPMENT_TEAM: RPCACN9AU3
      # Ad-hoc signing keeps `xcodebuild test` working without a provisioning
      # profile. Archiving for the App Store needs an Apple Distribution cert:
      # drop this line so Xcode signs with the real identity.
      CODE_SIGN_IDENTITY: "-"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  NocturnTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Nocturn
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_IDENTITY: "-"
      BUNDLE_LOADER: $(TEST_HOST)
      "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Nocturn.app/Contents/MacOS/Nocturn
      "TEST_HOST[sdk=iphoneos*]": $(BUILT_PRODUCTS_DIR)/Nocturn.app/Nocturn
      "TEST_HOST[sdk=iphonesimulator*]": $(BUILT_PRODUCTS_DIR)/Nocturn.app/Nocturn
schemes:
  Nocturn:
    build:
      targets: { Nocturn: all }
    test:
      targets: [NocturnTests]
