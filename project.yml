name: Nocturn
options:
  bundleIdPrefix: com.brianmurphy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.10"
targets:
  Nocturn:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Nocturn]
    info:
      path: Nocturn/Info.plist
      properties:
        CFBundleDisplayName: Nocturn
        NSLocalNetworkUsageDescription: >-
          Nocturn connects to your Hermes agent dashboard on your local
          network to display its status.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.brianmurphy.nocturn
  NocturnTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Nocturn
schemes:
  Nocturn:
    build:
      targets: { Nocturn: all }
    test:
      targets: [NocturnTests]
